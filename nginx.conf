server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location /images/ {
        try_files $uri =404;
        expires 30d;
    }

    # Webvisor replays an old HTML snapshot after a deployment. If that
    # snapshot requests a previous hashed stylesheet, serve the current
    # stable stylesheet instead of rendering the session without styles.
    location ~* ^/_astro/.*\.css$ {
        try_files $uri /_astro/SiteFooter.css;
        expires -1;
    }

    location ~* \.html$ {
        expires -1;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    set $frame_options '';

    if ($http_referer !~* '^https?://([^/]+\.)?(oblepiha-vpn\.ru|webvisor\.com|metri[ck]a\.yandex\.(com|ru|by|com\.tr))/') {
        set $frame_options 'SAMEORIGIN';
    }

    add_header X-Frame-Options $frame_options always;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
